<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" width="720" height="520">
  <style>
    .box{fill:#f6f8fa;stroke:#d0d7de;stroke-width:1.5}
    .amber{fill:#fff8c5;stroke:#d4a72c;stroke-width:1.5}
    .green{fill:#dafbe1;stroke:#2da44e;stroke-width:1.5}
    text{font-family:'Segoe UI',Arial,Helvetica,sans-serif;fill:#1f2328}
    .th{font-size:14px;font-weight:600}
    .ts{font-size:12px;fill:#57606a}
    .ln{stroke:#57606a;stroke-width:1.5;fill:none}
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <text class="th" x="360" y="24" text-anchor="middle" font-size="15">3GPP RAG conformance pipeline — system architecture</text>

  <!-- sources -->
  <rect class="box" x="40" y="44" width="290" height="58" rx="8"/>
  <text class="th" x="185" y="68" text-anchor="middle">OpenAirInterface NTN lab</text>
  <text class="ts" x="185" y="86" text-anchor="middle">gNB · nrUE · CN5G · RFsimulator</text>

  <rect class="box" x="390" y="44" width="290" height="58" rx="8"/>
  <text class="th" x="535" y="68" text-anchor="middle">UERANSIM + Open5GS</text>
  <text class="ts" x="535" y="86" text-anchor="middle">5G call flows + failure logs</text>

  <line class="ln" x1="185" y1="102" x2="185" y2="128" marker-end="url(#a)"/>
  <line class="ln" x1="535" y1="102" x2="535" y2="128" marker-end="url(#a)"/>

  <!-- outputs of sources -->
  <rect class="box" x="40" y="128" width="290" height="56" rx="8"/>
  <text class="th" x="185" y="151" text-anchor="middle">evidence/  (per test case)</text>
  <text class="ts" x="185" y="169" text-anchor="middle">pcaps + gNB/UE/AMF logs + configs</text>

  <rect class="box" x="390" y="128" width="290" height="56" rx="8"/>
  <text class="th" x="535" y="151" text-anchor="middle">3GPP RAG index</text>
  <text class="ts" x="535" y="169" text-anchor="middle">3GPP specs + failure logs (FastAPI+Ollama)</text>

  <line class="ln" x1="535" y1="184" x2="535" y2="210" marker-end="url(#a)"/>

  <rect class="amber" x="390" y="210" width="290" height="56" rx="8"/>
  <text class="th" x="535" y="233" text-anchor="middle">offline 3GPP RAG</text>
  <text class="ts" x="535" y="251" text-anchor="middle">retrieves specs → llama3 · mistral (Ollama)</text>

  <!-- feed into pipeline -->
  <line class="ln" x1="185" y1="184" x2="185" y2="300" marker-end="url(#a)"/>
  <line class="ln" x1="535" y1="266" x2="535" y2="300" marker-end="url(#a)"/>

  <rect class="box" x="70" y="300" width="580" height="104" rx="8"/>
  <text class="th" x="360" y="324" text-anchor="middle">5G Conformance Pipeline</text>
  <text class="ts" x="360" y="346" text-anchor="middle">inputs: evidence  +  spec.md contract (TS clause → must / must not)</text>
  <text class="ts" x="360" y="366" text-anchor="middle">graders: impl_claude (reference) · impl_llama3 · impl_mistral</text>
  <text class="ts" x="360" y="386" text-anchor="middle">compare: diff_report.py → do all three agree?</text>

  <line class="ln" x1="360" y1="404" x2="360" y2="428" marker-end="url(#a)"/>

  <rect class="green" x="160" y="428" width="400" height="56" rx="8"/>
  <text class="th" x="360" y="451" text-anchor="middle">golden + PASS / FAIL + evidence report + CI</text>
  <text class="ts" x="360" y="469" text-anchor="middle">frozen when all three agree · human-owned pytest oracle</text>

  <text class="ts" x="360" y="504" text-anchor="middle">sources generate the logs (OAI · UERANSIM · Open5GS)   ·   amber = offline AI   ·   green = trusted, frozen result</text>
</svg>
